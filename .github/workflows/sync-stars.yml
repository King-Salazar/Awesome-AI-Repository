name: Sync GitHub stars

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: star-collector-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Synchronize starred repositories
        env:
          STAR_COLLECTOR_TOKEN: ${{ secrets.STAR_COLLECTOR_TOKEN }}
        run: python scripts/sync_stars.py

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/starred.json README.md
          if git diff --cached --quiet; then
            echo "No substantive star changes to commit."
            exit 0
          fi
          git commit -m "chore: sync starred repositories"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
