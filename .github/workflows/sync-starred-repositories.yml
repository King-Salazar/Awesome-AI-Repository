name: Sync starred AI repositories

on:
  schedule:
    # GitHub cron uses UTC. Running at both candidates and checking Europe/Rome
    # keeps the effective time at 09:00 across CET and CEST.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-starred-ai-repositories
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check local synchronization time
        id: local-time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          TZ: Europe/Rome
        run: |
          if [ "$(date +%z)" = "+0200" ]; then
            expected_schedule="0 7 * * *"
          else
            expected_schedule="0 8 * * *"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_SCHEDULE" = "$expected_schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.local-time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Sync starred AI repositories
        if: steps.local-time.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARRED_USERNAME: SaPPhire999-afk
        run: node scripts/sync-starred-repos.js

      - name: Commit README changes
        if: steps.local-time.outputs.run == 'true'
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync starred AI repositories"
          git push
